name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Just one version for now (this project needs 21+ for virtual threads and pattern
      # matching for switch) - a matrix entry so bumping the JDK later is a one-line change.
      matrix:
        java: [21]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      # `verify`, not `test` - this also runs the JaCoCo coverage gate and the SpotBugs
      # check, both bound to the verify phase, so a coverage drop or a real bug pattern
      # fails CI the same way a broken test would.
      - name: Build and test
        run: mvn -B verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
